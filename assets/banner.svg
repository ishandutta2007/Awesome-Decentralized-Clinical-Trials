<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations for Dynamic Background Aspects */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }

    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    @keyframes dashMove {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(-10px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(420px); opacity: 0; }
    }

    .bg-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .card-float-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 6s ease-in-out infinite; }
    .animated-line {
      stroke-dasharray: 20, 10;
      animation: dashMove 30s linear infinite;
    }
    .scanner { animation: scanline 8s ease-in-out infinite; }
    
    /* Typography */
    .hero-title {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#titleGradient);
      letter-spacing: -0.5px;
    }

    .hero-subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }

    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }

    .metric-value {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #38bdf8;
    }

    .metric-label {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />

  <!-- Animated Glowing Background Orbs -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.08" class="bg-pulse" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="220" fill="#818cf8" opacity="0.08" class="bg-pulse" filter="url(#glow)" />
  <circle cx="600" cy="380" r="150" fill="#c084fc" opacity="0.06" class="bg-pulse" filter="url(#glow)" />

  <!-- Tech Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Dynamic Connecting Network Lines (Background Layer) -->
  <path d="M 100 320 Q 350 380 600 320 T 1100 340" fill="none" stroke="url(#lineGlow)" stroke-width="3" class="animated-line" filter="url(#softGlow)" />
  <path d="M 50 280 Q 400 220 750 300 T 1150 240" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" class="animated-line" />

  <!-- Animated Floating Feature Cards (Positioned in Background / Lower Side so Title stays clear) -->
  <g class="card-float-1" transform="translate(60, 270)">
    <rect width="240" height="95" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" filter="url(#softGlow)" />
    <circle cx="35" cy="35" r="16" fill="#0284c7" opacity="0.2" />
    <text x="35" y="40" text-anchor="middle" fill="#38bdf8" font-size="16">📋</text>
    <text x="65" y="36" class="badge-text">eConsent &amp; ePRO</text>
    <text x="65" y="54" class="metric-label">Remote Patient Intake</text>
    <rect x="20" y="70" width="200" height="4" rx="2" fill="#1e293b" />
    <rect x="20" y="70" width="140" height="4" rx="2" fill="#38bdf8" />
  </g>

  <g class="card-float-2" transform="translate(480, 270)">
    <rect width="240" height="95" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" filter="url(#softGlow)" />
    <circle cx="35" cy="35" r="16" fill="#6366f1" opacity="0.2" />
    <text x="35" y="40" text-anchor="middle" fill="#818cf8" font-size="16">⚡</text>
    <text x="65" y="36" class="badge-text">Open-Source EDC</text>
    <text x="65" y="54" class="metric-label">Clinical Rules &amp; CDM</text>
    <text x="20" y="80" class="metric-value">4,000+ Rules</text>
    <text x="140" y="80" class="metric-label" font-size="10">Engine Active</text>
  </g>

  <g class="card-float-1" transform="translate(900, 270)">
    <rect width="240" height="95" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" filter="url(#softGlow)" />
    <circle cx="35" cy="35" r="16" fill="#a855f7" opacity="0.2" />
    <text x="35" y="40" text-anchor="middle" fill="#c084fc" font-size="16">🌐</text>
    <text x="65" y="36" class="badge-text">SaaS Ecosystem</text>
    <text x="65" y="54" class="metric-label">Decentralized Trials</text>
    <text x="20" y="80" class="metric-value">$11.5B Market</text>
  </g>

  <!-- FOREGROUND LAYER: Main Hero Title & Subtitle (Guaranteed 100% visible and un-obscured) -->
  <g transform="translate(60, 110)">
    <!-- Top Pill Category Badge -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="15" cy="15" r="5" fill="#10b981" />
    <text x="28" y="20" class="badge-text" fill="#34d399">✨ AWESOME DECENTRALIZED CLINICAL TRIALS</text>

    <!-- Main Title -->
    <text x="0" y="80" class="hero-title">Awesome Decentralized Clinical Trials</text>

    <!-- Subtitle -->
    <text x="0" y="120" class="hero-subtitle">Curated SaaS Platforms, Open-Source EDC, eConsent &amp; Remote Patient Tools</text>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#titleGradient)" />
</svg>
